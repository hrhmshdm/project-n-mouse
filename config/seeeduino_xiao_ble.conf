# マウス機能（ポインティング・滑らかスクロール）を有効化
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# デバイスの種類を「キーボード(961)」から「マウス(962)」に変更
CONFIG_BT_DEVICE_APPEARANCE=962

# ロータリーエンコーダを有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetoothの送信出力を強化（接続安定化）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth通信間隔を最小化（低遅延マウス設定）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Bluetooth画面に表示されるデバイス名
CONFIG_ZMK_KEYBOARD_NAME="Nothing Mouse"

# NFC1ピン(P0.09)をPAW3395のMOTION割り込みピンとして使うために必須
CONFIG_NFCT_PINS_AS_GPIOS=y

# PAW3395 光学センサー用ドライバとSPI通信を有効化
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3395=y

# --- Bluetooth設定 ---
# ペアリングできる最大デバイス数を2台（会社用・自宅用）に制限
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# --- 省電力設定 ---
# ディープスリープを有効化（長期間動かさないと完全に眠り、クリック等で復帰）
CONFIG_ZMK_SLEEP=y
# ディープスリープに入るまでの時間（ミリ秒）※例：15分(900000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

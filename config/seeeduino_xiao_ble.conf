# ==========================================================
# 1. Device Information / デバイス基本情報
# ==========================================================
# Advertised Bluetooth device name
# BLE接続時の表示名
CONFIG_ZMK_KEYBOARD_NAME="N-Mouse"

# Set Bluetooth appearance to Generic Mouse (962) instead of Keyboard (961)
# デバイスの種類をキーボード(961)からマウス(962)に変更
CONFIG_BT_DEVICE_APPEARANCE=962

# ==========================================================
# 2. Mouse, Sensor & Encoder Settings / マウス・センサー・エンコーダ設定
# ==========================================================
# Enable pointing device functionality and smooth scrolling
# ポインティング機能とスムーススクロールの有効化
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Enable SPI bus and input subsystem for PixArt PAW3395 optical sensor
# PAW3395光学センサー用のSPI通信および入力サブシステムを有効化
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3395=y

# Reconfigure NFC1 pin (P0.09) as standard GPIO for PAW3395 MOTION interrupt
# P0.09(NFC1ピン)をセンサーのMOTION割り込み用GPIOとして使用
CONFIG_NFCT_PINS_AS_GPIOS=y

# ----------------------------------------------------------
# Sensor Report Rate (125Hz / 250Hz Selection)
# センサーレポート周期設定（125Hz または 250Hz を選択）
# ----------------------------------------------------------
# [Option A: 125Hz (8ms) - Recommended for Power Saving & Smoothness / 省電力・バランス重視]
CONFIG_PAW3395_REPORT_INTERVAL_MIN=8

# [Option B: 250Hz (4ms) - High Response Mode / 高応答モード（使う場合は上をコメントアウトして有効化）]
# CONFIG_PAW3395_REPORT_INTERVAL_MIN=4

# Enable mechanical rotary encoder (EC11)
# EC11機械式ロータリーエンコーダの有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==========================================================
# 3. Bluetooth Connectivity & Profiles / Bluetooth通信・プロファイル設定
# ==========================================================
# Limit maximum paired hosts to 2 profiles (e.g., Profile 0: Work / Profile 1: Home)
# ペアリング台数を最大2台（例: プロファイル0=会社用 / 1=自宅用）に制限
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# BLE connection parameters tuned for 125Hz/250Hz & power efficiency
# 125Hz(8ms)〜250Hz(7.5ms)駆動と省電力を両立するBLE接続インターバル設定
# (Unit: 1.25ms -> 6 = 7.5ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Allow slave latency to skip empty BLE events when mouse is stationary (saves power without adding input lag)
# 静止中の空通信をスキップして省電力化（操作時は遅延ゼロで即座に通信再開）
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CTLR_PHY_2M=y

# ==========================================================
# 4. Power Management & Battery Optimization / 省電力・バッテリー最適化
# ==========================================================
# Enable internal DC/DC converter on nRF52840 (Reduces MCU/BLE active current by ~35%)
# nRF52840内蔵のDC/DCコンバータを明示的に有効化（LDO比でMCU・無線消費電流を約35%削減）
CONFIG_BOARD_ENABLE_DCDC=y

# Reduce BLE transmit power to -4dBm for power savings
# (Uncomment CONFIG_BT_CTLR_TX_PWR_0=y if connection stability issues occur)
# BLE送信出力を-4dBmに下げて消費電流を削減（接続が不安定な場合は0dBmを有効化）
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y
# CONFIG_BT_CTLR_TX_PWR_0=y

# Report battery percentage every 180 seconds (3 minutes)
# バッテリー残量を180秒（3分）おきに通知
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180

# Enter idle state after 10 seconds of inactivity (instant wake-up on motion/click)
# 操作停止後10秒でアイドル状態へ移行（操作時に遅延なく即時復帰）
CONFIG_ZMK_IDLE_TIMEOUT=10000

# Enable deep sleep after 10 minutes (600,000ms) of inactivity
# 操作停止後10分でディープスリープへ移行
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# ==========================================================
# 5. On-Board RGB LED Widget / 内蔵RGB LEDインジケータ (zmk-rgbled-widget)
# ==========================================================
# Enable RGB LED indicator for boot, sleep wake, profile switching, and battery status
# 起動・スリープ復帰・接続先切替・バッテリー状態を内蔵LEDで表示
CONFIG_RGBLED_WIDGET=y

# Battery level alert thresholds (low: <= 20%, critical: <= 5%)
# バッテリー残量警告のしきい値（低残量: 20%以下 / 危険: 5%以下）
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=5

# ==========================================================
# 1. デバイス基本情報
# ==========================================================
# Bluetooth画面に表示されるデバイス名
CONFIG_ZMK_KEYBOARD_NAME="Nothing Mouse"

# デバイスの種類を「キーボード(961)」から「マウス(962)」に変更
CONFIG_BT_DEVICE_APPEARANCE=962

# ==========================================================
# 2. マウス・センサー・エンコーダ設定
# ==========================================================
# マウス機能（ポインティング・滑らかスクロール）を有効化
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# PAW3395 光学センサー用ドライバとSPI通信を有効化
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3395=y

# NFC1ピン(P0.09)をPAW3395のMOTION割り込みピンとして使うために必須
CONFIG_NFCT_PINS_AS_GPIOS=y

# センサーからの出力間隔を12ms（約83Hz）に束ねてBLE渋滞とデータ欠落を防止
CONFIG_PAW3395_REPORT_INTERVAL_MIN=12

# ロータリーエンコーダを有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==========================================================
# 3. Bluetooth 通信・プロファイル設定
# ==========================================================
# ペアリングできる最大デバイス数を2台（0:会社Win用 / 1:自宅Mac用）に制限
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# 通信間隔・高速化設定（Mac / Win 両対応）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CTLR_PHY_2M=y

# ==========================================================
# 4. 省電力・バッテリー設定
# ==========================================================
# Bluetooth送信出力を +8dBm から -4dBm に引き下げて省電力化
# ※もしPCがデスク下などで通信が途切れる場合は CONFIG_BT_CTLR_TX_PWR_0=y に変更してください
// CONFIG_BT_CTLR_TX_PWR_MINUS_4=y
CONFIG_BT_CTLR_TX_PWR_0=y

# ディープスリープを有効化（15分＝900,000ms 放置でスリープ、クリックで復帰）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# バッテリー残量の定期レポート（3分＝180秒おき）
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180

# ==========================================================
# 5. 内蔵3色LEDインジケータ設定 (zmk-rgbled-widget)
# ==========================================================
# 電源ON時・スリープ復帰時・プロファイル切替時に内蔵LEDで状態を自動表示
CONFIG_RGBLED_WIDGET=y

# バッテリー残量警告のしきい値（20%以下で黄/赤警告、5%以下で危険点滅）
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=5
